server {
    listen 80;
    server_name taskhub.tomas-dev.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://taskhub.tomas-dev.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name taskhub.tomas-dev.cz;

    ssl_certificate /etc/letsencrypt/live/taskhub.tomas-dev.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskhub.tomas-dev.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:60000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
