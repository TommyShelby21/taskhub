version: "3.8"

services:

  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: tomas
      POSTGRES_PASSWORD: tomas
    expose:
      - "5432"

  backend:
    build:
      context: .
    command:
      ["/app/entrypoint.prod.sh"]
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://tomas:tomas@db:5432/taskhub
      - DJANGO_SETTINGS_MODULE=backend.production
    depends_on:
      - db
    expose:
      - "60000"

  frontend:
    build:
      context: ./vue
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  postgres_data:
  static_volume:
