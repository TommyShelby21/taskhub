name: CI/CD

# kdy spustit
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: django

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: taskhub
          POSTGRES_USER: tomas
          POSTGRES_PASSWORD: tomas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Zrychlí opakované běhy
          cache-dependency-path: django/requirements.txt

      - name: Nainstaluj závislosti
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spust testy
        env:
          DATABASE_URL: postgres://tomas:tomas@localhost:5432/taskhub
          DJANGO_SETTINGS_MODULE: core.production
          SECRET_KEY: ci-only-not-a-real-secret # production.py vyžaduje SECRET_KEY; pro testy stačí dummy hodnota
        run:
          python manage.py test
